<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Tracker for YouTube</title>
<style>
  :root {
    --ink: #1a1a1a; --muted: #5c5c5c; --line: #e4e4e7;
    --bg: #ffffff; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ececec; --muted: #a1a1aa; --line: #2c2c30;
      --bg: #141416; --accent: #6b9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding-block: 64px; padding-inline: 20px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 0 0 22px; color: var(--muted); }
  a { color: var(--accent); }
  footer {
    margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13px;
  }
</style>
</head>
<body>
<main>
  <h1>Topic Tracker for YouTube</h1>
  <p>A Chrome extension that measures how much time you spend on YouTube,
  sorted into topics. Everything stays in your browser.</p>
  <p><a href="privacy.html">Privacy policy</a></p>

  <footer>
    An independent project. Not affiliated with, endorsed by, or sponsored by
    YouTube or Google.
  </footer>
</main>
</body>
</html>
